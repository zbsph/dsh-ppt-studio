# DSH profile bundle patch —— 「PPT 工作室」插件行（package.json 的 dsh.bundle.patch 指向本文件）
#
# 安装（一条命令，不需要 npm 账号）：
#     dsh plugin --profile web add dsh-ppt-studio                     # npm（2026-09-18 起，推荐：短、可升级）
#     dsh plugin --profile web add https://github.com/zbsph/dsh-ppt-studio/releases/download/<tag>/<资产名>.tgz   # 离线/归档通道
# `dsh plugin` 会在 profile 目录里跑 pnpm，然后核对 package.json 的 dsh.profile.bundles：
# **声明了 dsh.bundle.patch 的依赖自动入栈**（本文件即由 package.json 的 dsh.bundle.patch 指向）。
#
# 装配模型（2026-09-18 最终态 = **装上即可用**，见 docs/02 §2.1 与 docs/03 当日记录）：
#   · 本行 = 把插件挂进 **profile 层**；插件在 `apply()` 里向**拿到手的那个 ctx** 注册全部能力面
#     （22 个 ppt_* 工具 / `/ppt` 命令面 / `ppt_state` / 4 本内嵌技能 / 工作流提示段）⇒ 该 profile 的
#     **每个会话**都能用（含官方 standard）。
#   · 想要"只在「PPT 工作室」预设里生效"的用户改用 `node scripts/install.mjs --isolate`：安装器会摘掉本
#     profile bundle，改为**预设目录内 junction + 相对路径行**（`./plugin/lib/index.js`——相对行按组合文件
#     自己的目录解析，这是本机 DSH 上唯一能让预设既解析得到又保持健康的方式）。两种模式**互斥**，由安装器保证。
#   · 曾经的"按 agent 预设门控"设计（`agent/created` 钩子 + 预设层注册）已**证伪并撤除**：空白会话切预设时
#     agent 已存在、钩子不会为它触发（先建会话再切 = 永远没工具），且技能注册表按层读、子层注册父层看不见。
#     细节与实测见 docs/03（2026-09-18 三条撤回记录）与 src/index.js 顶部注释。
#   · 预设本身由插件**自交付**：apply 时若 `<dshHome>/.agent-presets/ppt/` 缺失就写一份
#     （**只在不存在时写、绝不覆盖**；交付的是剥离插件行的版本；`autoPreset: false` 可关闭）。
- insert:
    - id: ppt-studio
      name: 'dsh-ppt-studio'
      config:
        # 仅诊断用（插件日志打印 presetIds），**不再门控任何东西**——历史字段，保留以免改动既有装配行的形状
        presetIds: ['ppt']
        autoPreset: true
