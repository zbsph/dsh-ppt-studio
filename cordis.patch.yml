# DSH profile bundle patch —— 「PPT 工作室」插件行（package.json 的 dsh.bundle.patch 指向本文件）
#
# **默认安装途径 = npm（2026-09-26 起；web 与桌面端都支持）**，一条命令、不需要账号：
#     dsh plugin --profile web add dsh-ppt-studio                 # web
#     （桌面端：在「插件管理」里填同一个包名 dsh-ppt-studio）
# 归档/离线备选（同一份字节，sha256 可核对）：
#     dsh plugin --profile web add https://github.com/zbsph/dsh-ppt-studio/releases/download/<tag>/<资产名>.tgz
# `dsh plugin` 会在 profile 目录里跑 pnpm，然后核对 package.json 的 dsh.profile.bundles：
# **声明了 dsh.bundle.patch 的依赖自动入栈**（本文件即由 package.json 的 dsh.bundle.patch 指向）。
#
# 装配模型（2026-09-26 **第四次修订：按预设隔离**）
#   · 本行 = 把插件挂进 **profile 层**。`config.scope` 决定它的角色：
#       - `auto`（缺省，= 本行现在写的值）：声明「PPT 工作室」预设，并给它追加一行**自定位行**
#         （本包入口的绝对 `file://`）⇒ 预设的常驻组合会再挂本包一次（`scope: 'preset'`），
#         **那一次**把 22 个 `ppt_*` 工具 / `/ppt` 命令 / `ppt_state` / 4 本内嵌技能 / 语义路由 / 工作流提示段
#         全部注册在**预设作用域** ⇒ 只有「PPT 工作室」的会话看得到，**其他预设零影响**。
#         本档自己不注册任何能力面；只有判定隔离没生效时才**自动回落**到全局（功能不丢，只是没隔离）。
#       - `profile`：传统档，一律全局（所有预设都能用）。想回到旧行为就改成这个。
#       - `preset`：由自定位行使用，**不要**手工写进本行。
#     为什么"绝对 file://"是关键：预设里的每一行都在**注册表所在 ctx 的 baseUrl** 下解析
#     （= harness 包目录，不是 profile、也不是预设目录）⇒ 裸包名/相对名解析不到 ⇒ 预设被判 broken
#     ⇒ 前端选择器只渲染健康预设 ⇒ 用户根本选不到。绝对 URL 不受 baseUrl 影响，且每次启动按
#     `import.meta.url` 现算，升级换代不会陈旧。（0.1.7-rc.2 上真宿主实测通过。）
#   · 预设本身由插件**声明**：`ctx.agentPresets.register({id:'ppt', …plugins})`，随插件同生共死
#     （卸载即注销）。0.1.6 及以前是"写到 `<dshHome>/.agent-presets/ppt/`"——那条发现路径在 0.1.7 已被上游删除。
#   · 健康与降级：预设挂不上/无预设注册表时**自动回落全局能力面**；真实状态见 `ppt_state` 的
#     `presetDelivery.isolation`（preset / profile-fallback / profile）。详见 README §1.6 与 docs/02。
- insert:
    - id: ppt-studio
      name: 'dsh-ppt-studio'
      config:
        # auto = 想隔离（缺省）：声明预设 + 自定位行；不健康时自动回落全局。改 'profile' 可放弃隔离（传统档）。
        scope: 'auto'
        # 仅诊断用（插件日志打印 presetIds），**不再门控任何东西**——历史字段，保留以免改动既有装配行的形状
        presetIds: ['ppt']
        autoPreset: true
