pageType: cover
background: {type: solid, color: "$bg"}
safeArea: {top: 16, bottom: 16}
expectedOverlaps:
  - {pair: [tag, tagT]}
elements:
  - elementId: title
    elementType: text
    bounds: [60, 130, 840, 200]
    content: {text: "一起\n做成这件事", style: "$title", color: "$ink", fontSize: 56, lineHeight: 1.2}
  - elementId: ask
    elementType: text
    bounds: [60, 360, 840, 40]
    content: {text: "下一步：融资/合作/联系（18pt）", style: "$body", color: "$gray", fontSize: 18}
  - elementId: tag
    elementType: shape
    kind: rect
    bounds: [60, 452, 120, 36]
    fill: "$orange"
  - elementId: tagT
    elementType: text
    bounds: [60, 462, 120, 22]
    content: {text: "公司名", style: "$label", color: "#FFFFFF", align: center}
  - elementId: date
    elementType: text
    bounds: [200, 462, 300, 22]
    content: {text: "联系邮箱 · 日期", style: "$caption"}
