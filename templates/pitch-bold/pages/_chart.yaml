pageType: content
# 图表页母版（大字版：数字冲击 + 简图）
# 【2026-09-18】不预置"数据口径/来源/脱敏声明"占位块：依据写进页面 `source:` 字段（YAML，不进成品）；
#   页面上只有读者确实需要知道口径时才留一行小字，不要逐页挂（见 ppt-studio-data §3）。
expectedOverlaps:
  - {pair: [bigNumBg, bigNum]}
elements:
  - elementId: kick
    elementType: text
    bounds: [60, 48, 400, 26]
    content: {text: "03 · PROOF", style: "$caption", color: "$orange"}
  - elementId: title
    elementType: text
    bounds: [60, 84, 840, 90]
    content: {text: "数据证明：核心指标", style: "$title", color: "$ink", fontSize: 40}
  - elementId: bigNumBg
    elementType: shape
    kind: rect
    bounds: [60, 220, 340, 180]
    fill: "$orange"
  - elementId: bigNum
    elementType: text
    bounds: [80, 240, 300, 140]
    content: {text: "10 倍\n（44pt 大数字）", style: "$title", color: "#FFFFFF", fontSize: 44}
  - elementId: chartEl
    elementType: chart
    bounds: [460, 200, 440, 220]
    chart: {type: bar, data: {cols: ["指标", "值"], rows: [["当前", 12], ["改进", 88]]}}
  - elementId: footer
    elementType: text
    bounds: [60, 500, 300, 20]
    content: {text: "第 4 页 · 公司名", style: "$caption"}
