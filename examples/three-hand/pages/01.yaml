pageType: content
title: 设备报修工单状态机（默认风格）
diagram:
  type: state
  nodes:
    - {id: s0, label: 待受理, sub: 工单已创建}
    - {id: s1, label: 已派单, sub: 指定工程师}
    - {id: s2, label: 维修中, sub: 现场处理}
    - {id: s3, label: 待验收, sub: 用户确认}
    - {id: s4, label: 已归档, sub: 计入台账}
  edges:
    - {from: s0, to: s1, label: 受理}
    - {from: s1, to: s2, label: 出发}
    - {from: s2, to: s3, label: 完成}
    - {from: s3, to: s4, label: 确认}
    - {from: s3, to: s2, label: 返工}
