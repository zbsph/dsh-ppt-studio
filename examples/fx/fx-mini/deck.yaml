# 迷你夹具（快速路径）
version: 1
title: "迷你演示"
size: [960, 540]
theme:
  colors:
    ink: "#1F2937"      # 主墨
    primary: "#2563EB"  # 主蓝
    accent: "#F59E0B"   # 强调橙
    danger: "#C0392B"   # 警示红
    steel: "#64748B"    # 辅助灰蓝
    bg: "#F8FAFC"       # 页面底
    deep: "#0F172A"     # 深底（白字承载）
    # 扩展档（夹具调色：蓝/紫/绿阶 + 浅底）
    blue-soft: "#DBEAFE"
    blue-deep: "#1E3A8A"
    blue-mid: "#3B82F6"
    slate-deep: "#334155"
    slate-soft: "#CBD5E1"
    slate-lite: "#E2E8F0"
    amber-soft: "#FEF3C7"
    amber-deep: "#92400E"
    amber-dark: "#78350F"
    violet: "#8B5CF6"
    green: "#10B981"
    green-soft: "#D1FAE5"
    green-deep: "#065F46"
  textStyles:
    title: {fontSize: 32, color: "$ink", bold: true, fontFamily: "微软雅黑"}
    h1: {fontSize: 22, color: "$ink", bold: true, fontFamily: "微软雅黑"}
    h2: {fontSize: 16, color: "$ink", bold: true, fontFamily: "微软雅黑"}
    body: {fontSize: 14, color: "$ink", fontFamily: "微软雅黑"}
    small: {fontSize: 12, color: "$steel", fontFamily: "微软雅黑"}
  safeArea: {top: 34, bottom: 26, left: 40, right: 40}
  minFontSize: 12
pages:
  - pages/01.yaml
  - pages/02.yaml
  - pages/03.yaml
