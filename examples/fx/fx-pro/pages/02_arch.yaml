pageType: content
background: "#F8FAFC"
source: "夹具自造架构示意（三层嵌套 + 声明闭包）"
elements:
  - elementId: panel
    elementType: shape
    kind: roundRect
    bounds: [60, 80, 840, 380]
    fill: "#FFFFFF"
    line: {color: "#CBD5E1", width: 1}
  - elementId: box_a
    elementType: shape
    kind: rect
    bounds: [100, 130, 350, 240]
    fill: "#DBEAFE"
    line: {color: "#2563EB", width: 1}
  - elementId: box_a_t
    elementType: text
    bounds: [120, 150, 310, 60]
    content: {text: "领域本体（知识层）", style: "$h2", color: "#1E3A8A"}
  - elementId: box_a_b
    elementType: text
    bounds: [120, 230, 310, 120]
    content: {text: "对象·属性·关系·约束\n换场景 = 换实例，零重构", style: "$body", color: "#334155"}
  - elementId: box_b
    elementType: shape
    kind: rect
    bounds: [510, 130, 350, 240]
    fill: "#FEF3C7"
    line: {color: "#F59E0B", width: 1}
  - elementId: box_b_t
    elementType: text
    bounds: [530, 150, 310, 60]
    content: {text: "仿真内核（执行层）", style: "$h2", color: "#92400E"}
  - elementId: box_b_b
    elementType: text
    bounds: [530, 230, 310, 120]
    content: {text: "车间生产·负载评估·计划跟踪\n结论可迁移（泛化性）", style: "$body", color: "#78350F"}
  - elementId: arrow
    elementType: line
    points: [[450, 250], [508, 250]]
    arrow: true
    line: {color: "#2563EB", width: 2}
  - elementId: foot
    elementType: text
    bounds: [100, 470, 760, 40]
    content: {text: "知识层 → 映射 → 执行层：本体驱动仿真的泛化范式（A8 场景也在本页）", style: "$small"}
expectedOverlaps:
  - {pair: [panel, box_a]}
  - {pair: [panel, box_b]}
  - {pair: [box_a, box_a_t]}
  - {pair: [box_a, box_a_b]}
  - {pair: [box_b, box_b_t]}
  - {pair: [box_b, box_b_b]}
  # 声明闭包：panel×box_a_t 等隔层对由包含关系传递自动通过，无需声明
