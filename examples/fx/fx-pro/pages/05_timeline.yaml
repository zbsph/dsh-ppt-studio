    elementType: text
    bounds: [60, 60, 500, 40]
    content: {text: "实施路线（五阶段）", style: "$h1"}
  - elementId: tl_line
    elementType: line
    points: [[80, 200], [860, 200]]
    line: {color: "#94A3B8", width: 2}
  - elementId: st1
    elementType: shape
    kind: pentagon
    bounds: [60, 140, 140, 60]
    fill: "#2563EB"
  - elementId: st1_t
    elementType: text
    bounds: [70, 148, 120, 44]
    content: {text: "建模", style: "$h2", color: "#FFFFFF", align: center}
  - elementId: st2
    elementType: shape
    kind: pentagon
    bounds: [220, 140, 140, 60]
    fill: "#3B82F6"
  - elementId: st2_t
    elementType: text
    bounds: [230, 148, 120, 44]
    content: {text: "映射", style: "$h2", color: "#FFFFFF", align: center}
  - elementId: st3
    elementType: shape
    kind: pentagon
    bounds: [380, 140, 140, 60]
    fill: "#F59E0B"
  - elementId: st3_t
    elementType: text
    bounds: [390, 148, 120, 44]
    content: {text: "仿真", style: "$h2", color: "#FFFFFF", align: center}
  - elementId: st4
    elementType: shape
    kind: pentagon
    bounds: [540, 140, 140, 60]
    fill: "#8B5CF6"
  - elementId: st4_t
    elementType: text
    bounds: [550, 148, 120, 44]
    content: {text: "验证", style: "$h2", color: "#FFFFFF", align: center}
  - elementId: st5
    elementType: shape
    kind: pentagon
    bounds: [700, 140, 140, 60]
    fill: "#10B981"
