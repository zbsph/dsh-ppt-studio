    elementType: text
    bounds: [710, 148, 120, 44]
    content: {text: "推广", style: "$h2", color: "#FFFFFF", align: center}
  - elementId: tl_note
    elementType: text
    bounds: [80, 300, 800, 100]
    content: {text: "单向推进 + 每阶段门禁：建模评审 → 映射校验 → 仿真对标 → 验证报告 → 批量复制\n（时间线为示意图，非真实排期）", style: "$body"}
expectedOverlaps:
  - {pair: [st1, tl_line]}
  - {pair: [st2, tl_line]}
  - {pair: [st3, tl_line]}
  - {pair: [st4, tl_line]}
  - {pair: [st5, tl_line]}
  - {pair: [st1, st1_t]}
  - {pair: [st2, st2_t]}
  - {pair: [st3, st3_t]}
  - {pair: [st4, st4_t]}
  - {pair: [st5, st5_t]}
