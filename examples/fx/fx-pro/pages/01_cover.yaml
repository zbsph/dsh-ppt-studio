pageType: cover
background: "#F8FAFC"
expectedOutOfSafeArea: [band]
elements:
  - elementId: band
    elementType: shape
    kind: rect
    bounds: [0, 0, 960, 540]
    fill: {type: gradient, stops: [{pos: 0, color: "#0F172A"}, {pos: 100, color: "#2563EB"}], angle: 90}
  - elementId: glow
    elementType: shape
    kind: ellipse
    bounds: [660, 34, 260, 260]
    fill: {color: "#FFFFFF", alpha: 18}
  - elementId: title
    elementType: text
    bounds: [80, 150, 700, 90]
    content: {text: "能力验证演示（自建夹具）", style: "$title", color: "#FFFFFF"}
  - elementId: sub
    elementType: text
    bounds: [80, 260, 600, 50]
    content: {text: "PPTD 中间层 · 声明制 · 双轨审阅", style: "$h1", color: "#CBD5E1"}
  - elementId: badge
    elementType: shape
    kind: chevron
    bounds: [80, 420, 200, 56]
    fill: "#F59E0B"
  - elementId: badge_t
    elementType: text
    bounds: [100, 430, 160, 40]
    content: {text: "v1.0.0", style: "$h2", color: "#0F172A", align: center}
expectedOverlaps:
  - {pair: [band, glow]}
  - {pair: [band, title]}
  - {pair: [band, sub]}
  - {pair: [band, badge]}
  - {pair: [band, badge_t]}
  - {pair: [glow, title]}
  - {pair: [glow, sub]}
  - {pair: [badge, badge_t]}
